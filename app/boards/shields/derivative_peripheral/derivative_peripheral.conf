# Overrides for the derivative keyboard in split-peripheral (dongle) mode.
# Role and Studio handling come from Kconfig.defconfig.

# The custom LED-map subsystem (src/led_map.c) calls central-only APIs
# (zmk_keymap_*, zmk_ble_active_profile_*, zmk_hid_indicators_*) that are not
# compiled in a split peripheral, so it must be disabled here or the image
# fails to link. The board defconfig force-enables it, so override with =n.
# Plain RGB underglow stays on, so the strip still shows its default effect;
# behavior-driven LED changes are central-side and are future work.
CONFIG_ZMK_LED_MAP=n

# USB stays available for flashing/charging, but there is no HID output in
# peripheral role. Uncomment to drop USB entirely and save a little power:
# CONFIG_ZMK_USB=n
