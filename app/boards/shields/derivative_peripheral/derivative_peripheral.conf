# Overrides for the derivative keyboard in split-peripheral (dongle) mode.
# Role and Studio handling come from Kconfig.defconfig.

# Keep the per-key RGB / LED map in dongle mode. led_map.c is now peripheral-safe
# (host-only indicator inputs are compiled out), and the led_map behavior is
# GLOBAL, so effect controls invoked on the dongle are relayed to this strip.
# ZMK_LED_MAP is inherited =y from the board defconfig -- nothing to set here.

# Propagate the host's caps-lock (HID indicator) state from the dongle to this
# peripheral so the caps-lock indicator LED works in dongle mode too. The
# BT-status and layer-status indicators are inherently central-side and stay off.
CONFIG_ZMK_SPLIT_PERIPHERAL_HID_INDICATORS=y

# USB stays available for flashing/charging, but there is no HID output in
# peripheral role. Uncomment to drop USB entirely and save a little power:
# CONFIG_ZMK_USB=n
