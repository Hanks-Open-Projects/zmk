board: []
shield: []
include:
  - board: hnkb40/nrf52840/zmk
  - board: hnkb40/nrf52840/zmk
    shield: settings_reset
  - board: hnkb40/nrf52840/zmk
    snippet: studio-rpc-usb-uart
    cmake-args: "-DCONFIG_ZMK_STUDIO=y"
    nickname: "studio"
  - board: derivative-rev-a/nrf52840/zmk
  - board: derivative-rev-a/nrf52840/zmk
    shield: settings_reset
  - board: derivative-rev-a/nrf52840/zmk
    snippet: studio-rpc-usb-uart
    cmake-args: "-DCONFIG_ZMK_STUDIO=y"
    nickname: "studio"
  # Dongle mode (Phase 0): keyboard as split peripheral + XIAO nRF52840 central.
  - board: derivative-rev-a/nrf52840/zmk
    shield: derivative_peripheral
    nickname: "peripheral"
  - board: xiao_ble/nrf52840/zmk
    shield: derivative_dongle
    nickname: "dongle"
  # Dongle mode (Phase 1 probe): single image with BOTH the standalone HID stack
  # and the split-peripheral stack compiled in. Compile-only milestone; runtime
  # role gating is layered on afterward.
  # ZMK Studio is force-off here: the board defconfig enables it for the standalone
  # experience, but a split-peripheral context does not compile the Studio subsystem
  # sources, so the force-compiled keymap/behaviors would reference unlinked Studio
  # symbols. A peripheral cannot run Studio anyway.
  - board: derivative-rev-a/nrf52840/zmk
    shield: derivative_peripheral
    cmake-args: "-DCONFIG_ZMK_DERIVATIVE_DUAL_ROLE=y -DCONFIG_ZMK_STUDIO=n"
    nickname: "dualrole"
